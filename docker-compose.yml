services:
  postgres:
    image: postgres:16-alpine
    container_name: check-in-board-postgres
    environment:
      POSTGRES_DB: check_in_board
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d check_in_board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
