debug: false

spring:
  application:
    name: check-in-board-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:checkinboard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:3333}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

check-in-board:
  service-name: ${SERVICE_NAME:check-in-board-backend}
  auth-jwt-secret: ${AUTH_JWT_SECRET:dev-auth-local-secret-not-for-production}
  ical-url-encryption-key: ${ICAL_URL_ENCRYPTION_KEY:${AUTH_JWT_SECRET:dev-auth-local-secret-not-for-production}}
  auth-password-reset-expose-token: ${AUTH_PASSWORD_RESET_EXPOSE_TOKEN:false}

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO
